name: refresh-leaderboards

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh.yml
      - scripts/**
      - templates/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-leaderboards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest DSH plugin data
        run: node scripts/fetch.mjs

      - name: Restore verify cache
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: verify-cache-${{ github.run_id }}
          restore-keys: verify-cache-

      - name: Verify genuine plugins (README/package.json evidence)
        run: node scripts/verify.mjs

      # Overlay strategy: generated content is always authoritative (computed
      # minutes ago from the live API), but the commit must apply onto the
      # LATEST origin/main — human pushes (README edits etc.) must survive.
      # A plain rebase conflicts on generated files and can regress README's
      # human sections, so: stash fresh data aside, hard-sync to origin/main,
      # restore data, render on top of the freshest human content, commit.
      - name: Sync, render, commit and push
        run: |
          set -e
          TMP="$RUNNER_TEMP/fresh"
          mkdir -p "$TMP"
          cp data/plugins.json "$TMP/plugins.json"
          [ -d data/history ] && cp -r data/history "$TMP/history" || true

          git fetch origin main
          git reset --hard origin/main

          cp "$TMP/plugins.json" data/plugins.json
          [ -d "$TMP/history" ] && rm -rf data/history && cp -r "$TMP/history" data/history

          node scripts/render.mjs
          node scripts/render-site.mjs
          node scripts/build-catalog.mjs

          git config user.name  dsh-bot
          git config user.email bot@users.noreply.github.com
          git add data docs README.md scripts/build-catalog.mjs
          if git diff --staged --quiet; then
            echo "no changes; skipping commit"
          else
            git commit -m "chore(data): refresh $(date -u +%FT%TZ)"
            git push origin main || echo "::warning::push raced with another commit; the next scheduled run converges"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
